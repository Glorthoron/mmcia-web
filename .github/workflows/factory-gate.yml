name: factory-gate
on:
  pull_request:
    branches: [main]
jobs:
  no-price-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep public price smells in tracked text
        run: |
          set -e
          # Fail if common price-leak patterns appear outside docs that allow the word "price" as policy
          if git grep -nE '(/pricing|precio_publico|Buy now \$[0-9]|€[0-9]|EUR[[:space:]]*[0-9]{2,})' -- \
            ':!FACTORY*.md' ':!AGENTS.md' ':!README.md' ':!OMH-PLAN*.md' \
            ':!progress.md' ':!findings.md' ':!task_plan.md' \
            ':!.agents/product-marketing.md' ':!.agents/skills-local/**' \
            ':!.cursor/**' ':!.github/**' 2>/dev/null; then
            echo "::error::Possible public price leak in app/content paths"
            exit 1
          fi
          echo "OK: no price-leak patterns in non-policy files"
